name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache: true
      - name: Install libseccomp headers
        run: sudo apt-get update && sudo apt-get install -y libseccomp-dev
      - name: Test with race detector
        run: go test -race -timeout=10m ./...
      - name: Vet
        run: go vet ./...
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Build binaries
        run: |
          CGO_ENABLED=1 go build -trimpath -o /tmp/api-server ./cmd/api-server
          CGO_ENABLED=1 go build -trimpath -o /tmp/sandbox-exec ./cmd/sandbox-exec
          CGO_ENABLED=1 go build -trimpath -o /tmp/simple-client ./cmd/simple-client
      - name: Build container image
        run: docker build -t coderushoj/croj-sandbox:ci .
      - name: Run privileged isolation tests in final image
        run: |
          CGO_ENABLED=1 go test -c -o /tmp/croj-sandbox-integration.test ./internal/sandbox
          docker run --rm \
            --privileged \
            --cgroupns=host \
            --pid=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v /tmp/croj-sandbox-integration.test:/tmp/croj-sandbox-integration.test:ro \
            -e CROJ_RUN_EXECUTOR_ISOLATION_TEST=1 \
            -e CROJ_TEST_SANDBOX_EXEC=/app/sandbox-exec \
            -e CROJ_SANDBOX_INSTANCE_ID=ci-${{ github.run_id }}-${{ github.run_attempt }} \
            --entrypoint /tmp/croj-sandbox-integration.test \
            coderushoj/croj-sandbox:ci \
            -test.v -test.count=1 -test.run='^TestPrivilegedLinux'
      - name: Verify language toolchains
        run: |
          docker run --rm --entrypoint sh coderushoj/croj-sandbox:ci -ec '
            command -v go
            command -v g++
            command -v python3
            command -v javac
            command -v java
            command -v node
          '
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: coderushoj/croj-sandbox:ci
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Upload SPDX SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sandbox-sbom-${{ github.sha }}
          path: sbom.spdx.json
          if-no-files-found: error
      - name: Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: coderushoj/croj-sandbox:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload Trivy SARIF
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          sarif_file: trivy-results.sarif
      - name: Fail on fixed HIGH or CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: coderushoj/croj-sandbox:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish-image:
    name: Publish attested release image
    if: ${{ github.ref_type == 'tag' }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out the complete tag history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Verify annotated SemVer release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git rev-parse "$GITHUB_REF_NAME^{tag}" >/dev/null
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - name: Set up QEMU for cross-architecture builds
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable multi-architecture image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/coderushoj/croj-sandbox:${{ github.ref_name }}
            ghcr.io/coderushoj/croj-sandbox:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Attest image provenance with GitHub OIDC
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ghcr.io/coderushoj/croj-sandbox
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Record immutable image manifest
        env:
          IMAGE_REPOSITORY: ghcr.io/coderushoj/croj-sandbox
          IMAGE_TAG: ${{ github.ref_name }}
          IMAGE_REVISION: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          test "${IMAGE_DIGEST#sha256:}" != "$IMAGE_DIGEST"
          jq -n \
            --arg repository "$IMAGE_REPOSITORY" \
            --arg tag "$IMAGE_TAG" \
            --arg revision "$IMAGE_REVISION" \
            --arg digest "$IMAGE_DIGEST" \
            --argjson platforms '["linux/amd64","linux/arm64"]' \
            '{repository:$repository,tag:$tag,revision:$revision,digest:$digest,platforms:$platforms}' \
            > sandbox-image.json
      - name: Upload immutable image manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sandbox-image-${{ github.sha }}
          path: sandbox-image.json
          if-no-files-found: error
