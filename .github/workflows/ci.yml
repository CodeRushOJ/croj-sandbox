name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.24.6
          cache: true
      - name: Install libseccomp headers
        run: sudo apt-get update && sudo apt-get install -y libseccomp-dev
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build binaries
        run: |
          CGO_ENABLED=1 go build -trimpath -o /tmp/api-server ./cmd/api-server
          CGO_ENABLED=1 go build -trimpath -o /tmp/simple-client ./cmd/simple-client
      - name: Build container image
        run: docker build -t coderushoj/croj-sandbox:ci .
      - name: Verify language toolchains
        run: |
          docker run --rm --entrypoint sh coderushoj/croj-sandbox:ci -ec '
            command -v go
            command -v g++
            command -v python3
            command -v javac
            command -v java
            command -v node
          '
